<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AluminumAI</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="page-bg">

    <div class="auth-page">
        <div class="auth-box anim-1">

            <div class="auth-header">
                <div class="auth-icon">⚙️</div>
                <h2>Welcome back</h2>
                <p>Sign in to your AluminumAI account</p>
            </div>

            <div class="card card-glow-blue auth-card">

                {% if error %}
                <div class="alert alert-error">⚠️ {{ error }}</div>
                {% endif %}

                <form method="POST" autocomplete="off">
                    {% csrf_token %}

                    <!-- dummy fields to absorb browser autofill -->
                    <input type="text"     style="display:none;" name="fake_user">
                    <input type="password" style="display:none;" name="fake_pass">

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-full" style="margin-top:0.5rem;">
                        Sign In →
                    </button>
                </form>

            </div>

            <div class="auth-footer" style="margin-top:1rem;">
                Don't have an account? <a href="/register/">Create one</a>
            </div>
            <div class="auth-footer" style="margin-top:0.5rem;">
                Are you an admin? <a href="/admin-login/">Admin Login</a>
            </div>

        </div>
    </div>

    <script>
        // Clear autofilled values after browser fills them
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }, 50);
        });
    </script>
</body>
</html>
