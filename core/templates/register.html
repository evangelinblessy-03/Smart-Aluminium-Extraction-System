<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — AluminumAI</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="page-bg">

    <div class="auth-page">
        <div class="auth-box anim-1">

            <div class="auth-header">
                <div class="auth-icon">✨</div>
                <h2>Create account</h2>
                <p>Join AluminumAI and start optimizing</p>
            </div>

            <div class="card card-glow-purple auth-card">

                {% if error %}
                <div class="alert alert-error">⚠️ {{ error }}</div>
                {% endif %}

                <form method="POST" autocomplete="off">
                    {% csrf_token %}

                    <!-- dummy fields to absorb browser autofill -->
                    <input type="text"     style="display:none;" name="fake_user">
                    <input type="password" style="display:none;" name="fake_pass">

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="reg_username" name="username" class="form-input" placeholder="Choose a username" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg_password" name="password" class="form-input" placeholder="Create a password" autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn btn-gradient btn-full" style="margin-top:0.5rem;">
                        Create Account →
                    </button>
                </form>

            </div>

            <div class="auth-footer">
                Already have an account? <a href="/login/">Sign in</a>
            </div>

        </div>
    </div>

    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('reg_username').value = '';
                document.getElementById('reg_password').value = '';
            }, 50);
        });
    </script>
</body>
</html>
